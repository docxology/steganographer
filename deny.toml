# cargo-deny configuration
# Run: cargo deny check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained (no vulnerability) and arrives
    # transitively through gstreamer-rs derive macros; requires an upstream fix.
    "RUSTSEC-2024-0436",
]

[licenses]
# Allow only MIT and Apache-2.0 licensed dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Allow wildcard for workspace deps
wildcards = "allow"

[sources]
unknown-registry = "warn"
