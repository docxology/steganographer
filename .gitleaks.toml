title = "Steganographer Secret Scan"

[extend]
useDefault = true

[allowlist]
description = "Exact public deterministic test/example keys and the RFC 6455 sample nonce"
regexes = [
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',
  '''^abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789$''',
  '''^a{64}$''',
  '''^b{64}$''',
  '''^0{64}$''',
  '''^(?:a1b2c3d4e5f6){5}a1b2$''',
  '''^000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f$''',
  '''^0123456789abcdef$''',
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
]

[[rules]]
id = "ed25519-private-key"
description = "Context-labelled expanded signing private key"
regex = '''(?i)\b(?:private_key|secret_key|signing_key)\s*[:=]\s*["']?([0-9a-f]{128})["']?'''
secretGroup = 1
tags = ["key", "ed25519"]

[[rules]]
id = "hex-secret-32bytes"
description = "Context-labelled 32-byte private/embedding/encryption key or token"
regex = '''(?i)\b(?:private_key|signing_key|encryption_key|embedding_key|secret_key|key|secret|token|password)\s*[:=]\s*["']?([0-9a-f]{64})["']?'''
secretGroup = 1
tags = ["key", "secret"]

[[rules]]
id = "raw-hex-private-key-file"
description = "Raw hex key material in explicitly private key filenames"
path = '''(?i)(?:^|/)(?:[^/]*\.(?:key|pem|secret)|id_ed25519)$'''
regex = '''(?i)(?:^|[^0-9a-f])([0-9a-f]{64}|[0-9a-f]{128})(?:$|[^0-9a-f])'''
secretGroup = 1
tags = ["key", "secret"]
