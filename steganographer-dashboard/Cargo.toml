[package]
name = "steganographer-dashboard"
description = "Web-based live dashboard for round-trip steganography verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
steganographer-core = { path = "../steganographer-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
webrtc = { version = "0.20.5", optional = true }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
openh264 = { version = "0.9.8", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
image = { workspace = true }
bytes = "1"
base64 = "0.22"
env_logger = { workspace = true }
log = { workspace = true }

[features]
webrtc = ["dep:webrtc", "dep:bytes", "dep:async-trait", "dep:openh264"]
