name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Check locked workspace
        run: cargo check --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        run: brew install gstreamer

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build CLI without GStreamer (gst feature gate)
        run: cargo build -p steganographer-cli --no-default-features --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-count:
    name: Update Test Count Badge
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Count tests
        id: count
        run: |
          # Sum the "test result: ok. N passed" lines from every test binary and
          # doc-test target. This counts tests the same way the `test` job does,
          # instead of grepping `#[test]` attributes (which misses `#[tokio::test]`
          # and macro-generated tests and silently drifted the badge).
          COUNT=$(cargo test --workspace 2>/dev/null | awk '/^test result:/ { sum += $4 } END { print sum+0 }')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update README badge
        run: |
          sed -i "s/badge\/tests-[0-9]*_passing/badge\/tests-${{ steps.count.outputs.count }}_passing/" README.md
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "ci: update test count badge to ${{ steps.count.outputs.count }}"
          git push

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  lint:
    name: Lint (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny (licenses + advisories)
        run: cargo deny check

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        with:
          config-path: .gitleaks.toml

  fuzz:
    name: Fuzz (nightly, 60s per target)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz

      - name: Install GStreamer (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Run fuzz targets (60s each)
        run: |
          cd steganographer-core
          cargo +nightly fuzz run fuzz_lsb_video_extract -- -max_total_time=60 -max_len=4096
          cargo +nightly fuzz run fuzz_payload_from_bytes -- -max_total_time=60 -max_len=4096
          cargo +nightly fuzz run fuzz_rs_decode -- -max_total_time=60 -max_len=4096
          cargo +nightly fuzz run fuzz_packet_decode -- -max_total_time=60 -max_len=8192
