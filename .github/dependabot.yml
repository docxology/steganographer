# Dependency refresh for this repository, per the docxology currency standard (CUR-11).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # This action's ref is the compiler version, and @1.91.0 is the declared
      # MSRV gate (Cargo.toml rust-version = 1.91). Bumping it automatically
      # would retire the locked minimum-compiler check; migrate deliberately.
      - dependency-name: "dtolnay/rust-toolchain"
