# cargo-release controls the shared version/changelog/single CLI-owned tag only.
# Install: cargo install cargo-release --locked
# Preview version changes: cargo release minor
# Execute reviewed local version changes: cargo release minor --execute
# Artifact assembly is separate and never publishes, commits, or tags:
#   bash scripts/release.sh --output dist/<new-directory> --variant all
# Run after selecting the version/source; see scripts/README.md for prerequisites,
# exact-source provenance, dirty candidates, verification, and no-clobber behavior.

shared-version = true
consolidate-commits = true
publish = false
push = false
tag = false
