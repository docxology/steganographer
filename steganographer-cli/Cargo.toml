[package]
name = "steganographer-cli"
description = "CLI binary for the steganographer toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "steganographer"
path = "src/main.rs"

[[example]]
name = "release"
path = "examples/release.rs"
test = true

[features]
# `gst` enables the live `video`/`audio` GStreamer pipelines. It is on by
# default so the workspace build keeps full functionality; build with
# `--no-default-features` for a GStreamer-free binary (offline
# encode/decode/verify/keygen/dashboard and the packet/OTS surfaces).
default = ["gst"]
ethereum = ["steganographer-core/ethereum"]
webrtc = ["steganographer-dashboard/webrtc"]
learned = ["steganographer-core/learned"]
gst = ["dep:steganographer-gst", "dep:gstreamer"]

[dependencies]
steganographer-core = { path = "../steganographer-core", features = ["ots"] }
steganographer-gst = { path = "../steganographer-gst", optional = true }
steganographer-dashboard = { path = "../steganographer-dashboard" }
clap = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
image = { workspace = true }
hound = "3.5"
blake3 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
gstreamer = { version = "0.23", features = ["v1_22"], optional = true }
tempfile = "3"

[dev-dependencies]
flate2 = "1"

[build-dependencies]
clap = { workspace = true }
steganographer-core = { path = "../steganographer-core", default-features = false }
clap_complete = "4"
clap_mangen = "0.2"


# Run workspace-wide tagging and changelog changes exactly once.
[package.metadata.release]
tag = true
tag-name = "v{{version}}"
pre-release-replacements = [
    { file = "../CHANGELOG.md", search = "(?m)^## \\[Unreleased\\]$", replace = "## [Unreleased]\n\n## [{{version}}] — {{date}}", exactly = 1 },
    { file = "../CHANGELOG.md", search = "(?m)^\\[Unreleased\\]:.*$", replace = "[Unreleased]: {{repository}}/compare/v{{version}}...HEAD\n[{{version}}]: {{repository}}/releases/tag/v{{version}}", exactly = 1 },
]
