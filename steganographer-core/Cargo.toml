[package]
name = "steganographer-core"
description = "Media-agnostic steganography algorithms, cryptographic binding, and configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["ots"]
# `ots` enables the OpenTimestamps client (`ots_client`/`ots_handler`), which
# needs an HTTP client. It is on by default so the workspace keeps full
# functionality; build with `--no-default-features` for a network-free core
# that also compiles for `wasm32-unknown-unknown`.
ots = ["dep:reqwest"]
ethereum = ["k256"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true, optional = true }
sha3 = { workspace = true }
chacha20poly1305 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
qrcode = "0.14"
chrono = "0.4"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
flate2 = "1"
# HTTP client for the OpenTimestamps attestation REST API (`ots_client`).
# Optional: only pulled in by the `ots` feature (default on).
reqwest = { workspace = true, optional = true }
ml-dsa = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = "0.5"
tokio = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
